name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Lake build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false

      - name: Verify privative magnitude kernel directly
        shell: bash
        run: |
          set -o pipefail
          lake env lean PrivativeMagnitude.lean | tee privative-magnitude-axioms.txt

      - name: Verify derivation kernel v1 directly
        shell: bash
        run: |
          set -o pipefail
          lake env lean KernelV1.lean | tee kernel-v1-axioms.txt

      - name: Verify integrated master derivation directly
        shell: bash
        run: |
          set -o pipefail
          lake env lean MasterDerivation.lean | tee master-derivation-axioms.txt

      - name: Reject missing or vacuous kernel
        shell: bash
        run: |
          test "$(wc -c < PrivativeMagnitude.lean)" -gt 1000
          for theorem in \
            abs_effect_eq_remaining \
            bounded_power \
            total_deprivation_annihilates \
            sign_changes_direction_not_magnitude \
            deprivation_reduces_capacity \
            opposition_is_borrowed
          do
            grep -qE "theorem[[:space:]]+${theorem}\b" PrivativeMagnitude.lean
            grep -q "PrivativeMagnitude.${theorem}" privative-magnitude-axioms.txt
          done

      - name: Reject proof escapes in privative magnitude kernel
        shell: bash
        run: |
          if grep -nE '\b(sorry|admit|unsafe)\b|^[[:space:]]*axiom\b' PrivativeMagnitude.lean; then
            echo "Proof escape detected in PrivativeMagnitude.lean"
            exit 1
          fi

      - name: Reject proof escapes in derivation kernel v1
        shell: bash
        run: |
          if grep -nE '\b(sorry|admit|unsafe)\b|^[[:space:]]*axiom\b' KernelV1.lean; then
            echo "Proof escape detected in KernelV1.lean"
            exit 1
          fi

      - name: Reject proof escapes or vacuous certificate in integrated root
        shell: bash
        run: |
          if grep -nE '\b(sorry|admit|unsafe)\b|^[[:space:]]*axiom\b' MasterDerivation.lean; then
            echo "Proof escape detected in MasterDerivation.lean"
            exit 1
          fi
          if grep -nE ':[[:space:]]*True[[:space:]]*:=' MasterDerivation.lean; then
            echo "Vacuous True theorem detected in MasterDerivation.lean"
            exit 1
          fi

      - name: Write public verification receipt
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            lean --version
            lake --version
            sha256sum PrivativeMagnitude.lean
            sha256sum KernelV1.lean
            sha256sum MasterDerivation.lean
            echo "lake_build=passed"
            echo "privative_magnitude_direct_check=passed"
            echo "kernel_v1_direct_check=passed"
            echo "integrated_master_derivation_direct_check=passed"
            echo "proof_escape_scan=passed"
            echo "integrated_root_vacuity_scan=passed"
            printf 'legacy_true_marker_count='
            grep -Ec 'theorem .*:[[:space:]]*True[[:space:]]*:=[[:space:]]*by[[:space:]]+trivial' Theophysics_Core.lean || true
            cat privative-magnitude-axioms.txt
            cat kernel-v1-axioms.txt
            cat master-derivation-axioms.txt
          } > verification-receipt.txt

      - name: Upload verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification-receipt
          path: verification-receipt.txt

